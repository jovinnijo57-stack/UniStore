<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | UniStore</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="logo" style="text-decoration: none;">
                <i class="fas fa-shopping-bag"></i> UniStore
            </a>
            <h2>Reset Your Password</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Enter your email and we'll send you a 6-digit
                reset code.</p>

            <div class="input-group">
                <label class="input-label">EMAIL ADDRESS</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <button onclick="requestReset()" id="reset-btn">Send Reset Code</button>

            <p id="result"
                style="margin-top: 2rem; display: none; padding: 1rem; border-radius: 12px; font-weight: 600;"></p>

            <div style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                Remembered? <a href="/login"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        function requestReset() {
            const btn = document.getElementById('reset-btn');
            const result = document.getElementById('result');
            const email = document.getElementById("email").value.trim();

            if (!email) {
                result.innerText = "Please enter your email";
                result.style.display = "block";
                result.style.background = "#fef2f2";
                result.style.color = "#ef4444";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";

            fetch("/api/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        result.innerText = data.message + " Redirecting...";
                        result.style.display = "block";
                        result.style.background = "#f0fdf4";
                        result.style.color = "#10b981";
                        setTimeout(() => window.location.href = "/reset-password?email=" + encodeURIComponent(email), 2000);
                    } else {
                        result.innerText = data.message || "Failed to send code";
                        result.style.display = "block";
                        result.style.background = "#fef2f2";
                        result.style.color = "#ef4444";
                        btn.disabled = false;
                        btn.innerText = "Send Reset Code";
                    }
                })
                .catch(err => {
                    console.error(err);
                    result.innerText = "Error. Please try again later.";
                    result.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Send Reset Code";
                });
        }
    </script>
</body>

</html>
