<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | UniStore</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0095FF;
            --success: #7ED321;
            --text-main: #2D2D2D;
            --text-muted: #8E8E93;
            --bg-body: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon-wrapper {
            width: 140px;
            height: 140px;
            background-color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 10px 25px rgba(126, 211, 33, 0.3);
        }

        .success-icon-wrapper i {
            font-size: 70px;
            color: white;
        }

        .order-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
        }

        .order-number-text {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .order-number {
            font-weight: 700;
        }

        .info-text {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn-receipt {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 149, 255, 0.2);
        }

        .btn-receipt:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 149, 255, 0.3);
            background-color: #0084E6;
        }

        .btn-exit {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-exit:hover {
            opacity: 0.8;
        }

        /* Mobile specific adjustments mimicking the screenshot */
        @media (max-width: 480px) {
            .success-container {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <!-- Success Icon -->
        <div class="success-icon-wrapper">
            <i class="fa-solid fa-check"></i>
        </div>

        <!-- Success Message -->
        <h1 class="order-title">Order Successfully Placed</h1>

        <!-- Order ID -->
        <p class="order-number-text">Your order number is <span class="order-number">{{ order_id }}</span>.</p>

        <!-- Message about email -->
        <p class="info-text">We'll email you an order confirmation with details and tracking info.</p>

        <!-- Actions -->
        <a href="/order-receipt/{{ order_id }}" class="btn-receipt">View Shopping Receipt</a>

        <a href="/user/dashboard" class="btn-exit">Exit</a>
    </div>

    <!-- Micro-interaction on load -->
    <script>
        window.onload = function () {
            console.log("Order Success Page Loaded");
            // Optional: You could clear some local storage here if needed, 
            // though the payment page handles cart clearing.
        }
    </script>
</body>

</html>
