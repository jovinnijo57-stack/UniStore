<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | UniStore</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="logo" style="text-decoration: none;">
                <i class="fas fa-shopping-bag"></i> UniStore
            </a>
            <h2>Set New Password</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Enter the 6-digit code sent to <b>{{ email }}</b>
                and your new password.</p>

            <div class="input-group">
                <label class="input-label">RESET CODE</label>
                <input type="text" id="code" placeholder="123456" maxlength="6" required
                    style="letter-spacing: 0.5rem; text-align: center; font-size: 1.5rem;">
            </div>

            <div class="input-group">
                <label class="input-label">NEW PASSWORD</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button onclick="resetPassword()" id="reset-btn">Update Password</button>

            <p id="result"
                style="margin-top: 2rem; display: none; padding: 1rem; border-radius: 12px; font-weight: 600;"></p>

            <div style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                Didn't get code? <a href="/forgot-password"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Try again</a>
            </div>
        </div>
    </div>

    <script>
        function resetPassword() {
            const btn = document.getElementById('reset-btn');
            const result = document.getElementById('result');
            const code = document.getElementById("code").value.trim();
            const password = document.getElementById("password").value;
            const email = "{{ email }}";

            if (!code || !password) {
                result.innerText = "All fields are required";
                result.style.display = "block";
                result.style.background = "#fef2f2";
                result.style.color = "#ef4444";
                return;
            }

            if (password.length < 8) {
                result.innerText = "Password must be at least 8 characters";
                result.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";

            fetch("/api/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email,
                    code: code,
                    password: password
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        result.innerText = "Password reset successful! Redirecting to login...";
                        result.style.display = "block";
                        result.style.background = "#f0fdf4";
                        result.style.color = "#10b981";
                        setTimeout(() => window.location.href = "/login", 2000);
                    } else {
                        result.innerText = data.message || "Failed to reset password";
                        result.style.display = "block";
                        result.style.background = "#fef2f2";
                        result.style.color = "#ef4444";
                        btn.disabled = false;
                        btn.innerText = "Update Password";
                    }
                })
                .catch(err => {
                    console.error(err);
                    result.innerText = "Error. Please try again.";
                    result.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                });
        }
    </script>
</body>

</html>
